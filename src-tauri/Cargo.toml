[package]
name = "file-atlas"
version = "2.0.0"
description = "Windows-first storage forensics and duplicate analysis"
authors = ["Alkai Dynamics"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "file_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "file-atlas"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1.8"
parking_lot = "0.12"
rayon = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
usn-journal-rs = "0.4.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
